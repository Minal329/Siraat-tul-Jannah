# Mobile CI — the Expo app. Runs on every pull request and every push to main.
name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Build (web bundle, to catch import errors)
        run: npx expo export --platform web --output-dir /tmp/expo-export
        env:
          EXPO_OFFLINE: "1"
